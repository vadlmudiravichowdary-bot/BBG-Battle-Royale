<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BBG Battle Royale</title><style>body{margin:0;background:#0f1a2e;overflow:hidden;color:white;font-family:Arial}#ui{position:fixed;top:0;width:100%;padding:10px;display:flex;justify-content:space-between;background:rgba(0,0,0,0.8);border-bottom:3px solid gold;font-weight:bold} #player{width:40px;height:40px;background:gold;border-radius:50%;position:absolute;border:3px solid white;box-shadow:0 0 15px gold}.enemy{width:32px;height:32px;background:red;border-radius:50%;position:absolute}.bullet{width:10px;height:10px;background:yellow;border-radius:50%;position:absolute}</style></head><body><div id="ui"><div>BBG ROYALE</div><div id="level">LEVEL 1</div><div id="score">SCORE:0</div></div><div id="game"><div id="player" style="left:50%;top:80%"></div></div><script>let score=0,level=1,px=innerWidth/2,py=innerHeight*0.8;let player=document.getElementById('player');function spawn(){let e=document.createElement('div');e.className='enemy';e.style.left=Math.random()*(innerWidth-40)+'px';e.style.top='-30px';document.getElementById('game').appendChild(e);let t=0;setInterval(()=>{t+=2;e.style.top=t+'px'},20)}setInterval(spawn,900);document.addEventListener('touchmove',t=>{px=t.touches[0].clientX;py=t.touches[0].clientY;player.style.left=px-20+'px';player.style.top=py-20+'px'});document.addEventListener('mousemove',e=>{px=e.clientX;py=e.clientY;player.style.left=px-20+'px';player.style.top=py-20+'px'});</script></body></html>
