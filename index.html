<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,maximum-scale=1.0">
<title>BBG BATTLE ROYALE - HORIZONTAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;touch-action:none}
#rotate{position:fixed;inset:0;background:#000;color:white;z-index:9999;display:none;align-items:center;justify-content:center;flex-direction:column;font-family:Arial;font-size:20px}
@media (orientation:portrait){#rotate{display:flex} #main{display:none}}
#main{width:100vw;height:100vh;background:#2b5a2b;position:relative;overflow:hidden}
#map{width:2000px;height:2000px;background:
radial-gradient(circle at 30% 30%,#3a7a3a 0%,#2b5a2b 40%,#1a3a1a 100%);
position:absolute;left:-500px;top:-500px}
.road{position:absolute;background:#444;border:2px solid #333}
.building{position:absolute;background:linear-gradient(#777,#444);border:3px solid #222;box-shadow:4px 4px 10px rgba(0,0,0,0.8)}
.building:after{content:'';position:absolute;inset:6px;background:rgba(0,0,0,0.3)}
.tree{position:absolute;width:40px;height:40px;background:radial-gradient(#1a8a1a,#0a4a0a);border-radius:50%;border:2px solid #052a05}
.char{position:absolute;width:48px;height:48px;z-index:50;display:flex;flex-direction:column;align-items:center}
.char-icon{font-size:36px;filter:drop-shadow(0 2px 4px black);line-height:36px}
.char-gun{font-size:16px;margin-top:-10px;transform:rotate(0deg)}
.char-name{font-size:9px;background:black;color:white;padding:1px 5px;border-radius:10px;margin-top:2px;font-weight:bold;border:1px solid gold}
.me .char-name{background:gold;color:black}
.enemy .char-icon{filter:drop-shadow(0 2px 4px black) hue-rotate(0deg)}
#ui{position:fixed;top:0;left:0;right:0;height:50px;background:linear-gradient(black,transparent);display:flex;justify-content:space-between;align-items:center;padding:0 20px;color:white;z-index:100;font-weight:bold}
#zone{position:absolute;border:4px dashed cyan;border-radius:50%;pointer-events:none;box-shadow:0 0 0 2000px rgba(0,100,255,0.15) inset;z-index:5}
.bullet{position:absolute;width:12px;height:4px;background:yellow;box-shadow:0 0 8px orange;border-radius:2px;z-index:60}
.loot{position:absolute;width:36px;height:36px;background:linear-gradient(cyan,#0088ff);border:2px solid white;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;z-index:20;box-shadow:0 0 12px cyan}
#controls{position:fixed;bottom:0;left:0;right:0;height:110px;display:flex;justify-content:space-between;align-items:center;padding:0 20px;z-index:100}
#joyBase{width:90px;height:90px;background:rgba(255,255,255,0.15);border-radius:50%;border:2px solid rgba(255,255,255,0.6);position:relative}
#joyStick{width:38px;height:38px;background:gold;border:2px solid white;border-radius:50%;position:absolute;left:26px;top:26px;box-shadow:0 0 12px gold}
#btns{display:flex;gap:15px}
.btn{width:70px;height:70px;border-radius:50%;border:3px solid white;display:flex;align-items:center;justify-content:center;font-size:28px;color:white;font-weight:bold}
#fire{background:radial-gradient(#ff3333,#990000);box-shadow:0 0 15px red}
#aim{background:radial-gradient(#33ff33,#009900)}
</style>
</head>
<body>
<div id="rotate"><div style="font-size:60px">📱➡️📱</div><div>PHONE NI HORIZONTAL GA TIPPU RA!</div></div>
<div id="main">
<div id="map"></div>
<div id="ui"><div>🔫 BBG ROYALE - HORIZONTAL</div><div id="alive">ALIVE: 50</div><div id="kills">KILLS: 0</div></div>
<div id="controls">
<div id="joyBase"><div id="joyStick"></div></div>
<div id="btns"><div class="btn" id="aim">🎯</div><div class="btn" id="fire">💥</div></div>
</div>
</div>
<script>
let map=document.getElementById('map'),main=document.getElementById('main'),aliveEl=document.getElementById('alive'),killsEl=document.getElementById('kills');
let px=1000,py=1000,kills=0,alive=50,jx=0,jy=0,angle=-90;
let enemies=[],bullets=[];

// CREATE REAL MAP - ROADS + BUILDINGS
function addRoad(x,y,w,h){let d=document.createElement('div');d.className='road';d.style.left=x+'px';d.style.top=y+'px';d.style.width=w+'px';d.style.height=h+'px';map.appendChild(d)}
function addBuilding(x,y,w,h){let d=document.createElement('div');d.className='building';d.style.left=x+'px';d.style.top=y+'px';d.style.width=w+'px';d.style.height=h+'px';map.appendChild(d)}
function addTree(x,y){let d=document.createElement('div');d.className='tree';d.style.left=x+'px';d.style.top=y+'px';map.appendChild(d)}
addRoad(0,950,2000,100);addRoad(950,0,100,2000);
for(let i=0;i<12;i++)addBuilding(600+Math.random()*800,600+Math.random()*800,80+Math.random()*80,80+Math.random()*80);
for(let i=0;i<30;i++)addTree(Math.random()*2000,Math.random()*2000);

let zone=document.createElement('div');zone.id='zone';zone.style.left='500px';zone.style.top='500px';zone.style.width='1000px';zone.style.height='1000px';map.appendChild(zone);

function createChar(type,x,y,name,icon){
let d=document.createElement('div');d.className='char '+type;
d.innerHTML=`<div class="char-icon">${icon}</div><div class="char-gun">🔫</div><div class="char-name">${name}</div>`;
d.x=x;d.y=y;d.hp=type=='me'?100:3;d.style.left=x+'px';d.style.top=y+'px';map.appendChild(d);return d;
}
let player=createChar('me',px,py,'BBG','🧑‍🎤');
let icons=['🥷','👨‍✈️','🧑‍🚀','👹','🤖','👾','🧟','👨‍🔧'];
for(let i=0;i<18;i++){let e=createChar('enemy',600+Math.random()*800,600+Math.random()*800,'E'+i,icons[Math.floor(Math.random()*icons.length)]);enemies.push(e)}
for(let i=0;i<10;i++){let l=document.createElement('div');l.className='loot';l.innerText=['🔫','🛡️','💊','🪖','🎒'][i%5];l.x=700+Math.random()*600;l.y=700+Math.random()*600;l.style.left=l.x+'px';l.style.top=l.y+'px';map.appendChild(l)}

let joyBase=document.getElementById('joyBase'),joyStick=document.getElementById('joyStick'),fireBtn=document.getElementById('fire');
joyBase.addEventListener('touchmove',e=>{
let r=joyBase.getBoundingClientRect();let x=e.touches[0].clientX-r.left-45;let y=e.touches[0].clientY-r.top-45;
let d=Math.hypot(x,y);if(d>28){x=x/d*28;y=y/d*28}
joyStick.style.left=26+x+'px';joyStick.style.top=26+y+'px';jx=x/28;jy=y/28;
if(Math.hypot(jx,jy)>0.2){angle=Math.atan2(jy,jx)*180/Math.PI}
},{passive:false});
joyBase.addEventListener('touchend',()=>{joyStick.style.left='26px';joyStick.style.top='26px';jx=0;jy=0});
fireBtn.addEventListener('touchstart',shoot);

function shoot(){
let b=document.createElement('div');b.className='bullet';
b.x=px+20;b.y=py+18;b.vx=Math.cos(angle*Math.PI/180)*14;b.vy=Math.sin(angle*Math.PI/180)*14;
b.style.left=b.x+'px';b.style.top=b.y+'px';b.style.transform=`rotate(${angle}deg)`;map.appendChild(b);bullets.push(b);
setTimeout(()=>{b.remove();bullets=bullets.filter(x=>x!=b)},1200);
}

function updateCamera(){
let cx=innerWidth/2-px,cy=innerHeight/2-py;
map.style.transform=`translate(${cx}px,${cy}px)`;
}

function loop(){
px+=jx*7;py+=jy*7;px=Math.max(200,Math.min(1800,px));py=Math.max(200,Math.min(1800,py));
player.x=px;player.y=py;player.style.left=px+'px';player.style.top=py+'px';
player.querySelector('.char-gun').style.transform=`rotate(${angle}deg)`;
player.style.transform=`rotate(0deg)`;
updateCamera();
enemies.forEach(e=>{let dx=px-e.x,dy=py-e.y;if(Math.hypot(dx,dy)<350){e.x+=dx*0.01;e.y+=dy*0.01;e.style.left=e.x+'px';e.style.top=e.y+'px'}});
bullets.forEach(b=>{
b.x+=b.vx;b.y
